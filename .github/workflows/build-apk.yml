name: Build Telegram Archive APK
on:
  push:
    branches: [main, feat/v05-native-apk]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The GitHub-hosted runner already provides Android SDK command-line tools.
      # setup-android@v3 currently invokes the removed SDK package "tools".
      - name: Install Android API 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramArchive-0.5-beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
