name: Build Telegram Archive v0.24 APK — archive and dock verification
on:
  push:
    branches: [main, feat/v024-verified-media-backups-and-motion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/sdktools
          mv /tmp/sdktools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK and run encrypted-backup regression tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Run Android emulator UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell input keyevent 82
            set +e
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
            outcome=$?
            echo "=== SYNTHETIC TELEGRAM BENCHMARKS ==="
            adb logcat -d -s TG_ARCHIVE_BENCH:I | tail -n 35 || true
            exit $outcome
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Archive-v0.24-TestResults
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Archive-v0.24-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
