name: Android 26-27-30 isolated emulator smoke
on:
  push:
    branches: [qa/v025-api26-27-30-emulator-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 27, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare API 35 build SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and run JVM tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon
      - name: Run synthetic UI and database tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 1536M
          disable-animations: true
          emulator-boot-timeout: 480
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api-${{ matrix.api }}-evidence
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/
          if-no-files-found: warn
