name: Feedback12 full-source build
on:
  push:
    branches: [qa/v025-feedback-ui-media-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore isolated source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/feedback12-source.part1.b64 .qa/feedback12-source.part2.b64 | base64 -d > /tmp/feedback12.tar.xz
          echo '0c329cc679aefd57c6302d37fc1f2ae7eeaefbb4314b6f5ef5688dcdc466bec9  /tmp/feedback12.tar.xz' | sha256sum -c -
          tar -tJf /tmp/feedback12.tar.xz | head -n 30
          tar -xJf /tmp/feedback12.tar.xz
      - name: SDK install
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and unit tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback12-fullsource-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
