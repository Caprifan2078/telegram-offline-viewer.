name: Feedback fixes Android QA
on:
  workflow_dispatch:
  push:
    branches: [qa/v025-feedback-ui-media-20261024]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 35 with explicit SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and JVM regression suite
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback12-baseline-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
          if-no-files-found: warn
