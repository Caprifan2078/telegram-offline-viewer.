name: v031 SQLite history migration on real Android emulator
on:
  push:
    branches: [qa/v031-history-tgs-cinema-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api26:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the same QA source and fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/history-tgs-source.part{1,2,3,4}.b64 | base64 -d >/tmp/source.tar.xz
          echo 'a6e0f2f5f0e037a00f6878f1fd1e6240d0faf6d22a0ec9574cfe5b93a0dfb154  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
          patch --batch -p1 < .qa/v031-history-comparison-fix.patch
          patch --batch -p1 < .qa/v031-isolated-appid.patch
      - name: Prepare Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Targeted SQLite migration (API 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ConversationPeriodsMigrationTest --stacktrace
      - name: Preserve Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-db-android26
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
