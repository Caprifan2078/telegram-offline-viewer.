name: Android SDK explicit path diagnosis
on:
  push:
    branches: [qa/v025-android-baseline-20261024]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install API 35 via SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile v0.25 and run JVM tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
