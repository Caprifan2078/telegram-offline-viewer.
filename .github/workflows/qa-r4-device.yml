name: Telegram Archive R4 Android Device QA
on:
  push:
    branches:
      - qa/r4-dual-chat-apk-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore R4 source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/r4-source.part{1,2,3,4,5}.b64 | base64 -d > /tmp/ta-r4-source.tar.xz
          echo "472ec436716929ce4fda36cbea5cc5de9978e58c82e48244e5643c208538c1ec  /tmp/ta-r4-source.tar.xz" | sha256sum -c -
          rm -rf app
          tar -xJf /tmp/ta-r4-source.tar.xz
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run synthetic integration tests on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.AnalyticsIntegrationTest,org.openarchive.telegram.MediaTabsIsolationTest,org.openarchive.telegram.PortableRestoreRegressionTest'
      - name: Save Android test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-archive-r4-android-device-qa
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
