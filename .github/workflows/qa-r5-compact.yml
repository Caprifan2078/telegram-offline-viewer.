name: Telegram Archive R5 Compact QA APK
on:
  push:
    branches: [qa/r5-compact-pauses-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore original R4 and apply reviewed R5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/r4-source.part{1,2,3,4,5}.b64 | base64 -d > /tmp/ta-r4.tar.xz
          echo "472ec436716929ce4fda36cbea5cc5de9978e58c82e48244e5643c208538c1ec  /tmp/ta-r4.tar.xz" | sha256sum -c -
          rm -rf app
          tar -xJf /tmp/ta-r4.tar.xz
          python3 .qa/r5_apply.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build both QA APKs with unit tests
        run: gradle assembleDebug assembleCompactQa testDebugUnitTest testCompactQaUnitTest --no-daemon --stacktrace
      - name: Verify offline permissions, separate package and sizes
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          mkdir -p qa-output
          cp app/build/outputs/apk/debug/app-debug.apk qa-output/telegram-archive-r5-regular.apk
          cp app/build/outputs/apk/compactQa/app-compactQa.apk qa-output/telegram-archive-r5-compact.apk
          for apk in qa-output/*.apk; do
            unzip -t "$apk" | tail -1
            "$aapt" dump badging "$apk" > "$apk.badging.txt"
            if grep -q "uses-permission: name='android.permission.INTERNET'" "$apk.badging.txt"; then exit 1; fi
          done
          grep -q "package: name='org.openarchive.telegram.qa'" qa-output/telegram-archive-r5-regular.apk.badging.txt
          grep -q "package: name='org.openarchive.telegram.qa.compact'" qa-output/telegram-archive-r5-compact.apk.badging.txt
          wc -c qa-output/*.apk
          sha256sum qa-output/*.apk > qa-output/SHA256SUMS.txt
          test "$(stat -c%s qa-output/telegram-archive-r5-compact.apk)" -lt "$(stat -c%s qa-output/telegram-archive-r5-regular.apk)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-archive-r5-compact-and-regular
          path: |
            qa-output/
            app/build/test-results/
          if-no-files-found: warn
