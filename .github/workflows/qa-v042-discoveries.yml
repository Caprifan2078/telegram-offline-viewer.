name: Telegram Archive 0.42 - discovery suite APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated R6, then apply 0.41 changes
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/r4-source.part{1,2,3,4,5}.b64 | base64 -d > /tmp/ta-r4.tar.xz
          echo "472ec436716929ce4fda36cbea5cc5de9978e58c82e48244e5643c208538c1ec  /tmp/ta-r4.tar.xz" | sha256sum -c -
          rm -rf app
          tar -xJf /tmp/ta-r4.tar.xz
          python3 .qa/r5_apply.py
          python3 .qa/r6_premium_apply.py
          base64 -d .qa/v041-delta.tar.gz.b64 > /tmp/v041-delta.tar.gz
          echo "ef35b1e7aa3f49f27efa6c58466807411a8330303fdfe64a7ea9bd39273c326e  /tmp/v041-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v041-delta.tar.gz
          # R6 CI build.gradle differs only in dependency alignment from the archived local copy.
          # Apply every source and manifest diff, then change version fields explicitly.
          awk '/^--- a\/app\/build.gradle$/{exit} {print}' r7-changes.patch | patch -p1 --batch
          sed -i "s/versionCode 40/versionCode 41/; s/versionName '0.40-qa-r6'/versionName '0.41'/; s/applicationIdSuffix '.compact'/applicationIdSuffix '.preview42'/; s/versionNameSuffix '-compact'/versionNameSuffix ''/" app/build.gradle
          grep -q "versionCode 41" app/build.gradle
          grep -q "applicationIdSuffix '.preview42'" app/build.gradle
          test -f app/src/main/java/org/openarchive/telegram/DemoChatActivity.java
          test -f app/src/test/java/org/openarchive/telegram/DemoConversationTest.java
      - name: Generate tiny completely local training media
        shell: bash
        run: |
          set -euo pipefail
          media=app/src/main/assets/tutorial
          mkdir -p "$media"
          cp app/src/androidTest/assets/voice.ogg "$media/voice.ogg"
          cp app/src/androidTest/assets/animated.gif "$media/demo.gif"
          cp app/src/androidTest/assets/photo.png "$media/sticker.png"
          printf 'Training file. No private user data.\n' > "$media/README.txt"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x2E7594:s=420x250" -frames:v 1 -q:v 5 "$media/photo.jpg"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x806D9C:s=420x250" -frames:v 1 -q:v 5 "$media/photo2.jpg"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=256x160:rate=12:duration=3" -c:v libx264 -preset ultrafast -crf 35 -pix_fmt yuv420p -movflags +faststart "$media/clip.mp4"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=4" -c:a libvorbis -q:a 1 "$media/music.ogg"
          test "$(stat -c%s "$media/clip.mp4")" -lt 800000
          find "$media" -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Apply reviewed 0.42 discovery patch and check version
        shell: bash
        run: |
          set -euo pipefail
          python3 .qa/v042_apply.py
          grep -q "versionCode 42" app/build.gradle
          grep -q "versionName '0.42'" app/build.gradle
          grep -q "applicationIdSuffix '.preview42'" app/build.gradle
          test -f app/src/main/java/org/openarchive/telegram/DiscoveryRules.java
          test -f app/src/test/java/org/openarchive/telegram/DiscoveryRulesTest.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build single optimized APK and run JVM tests
        run: gradle assembleCompactQa testCompactQaUnitTest --no-daemon --stacktrace
      - name: Check package, no Internet and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          cp app/build/outputs/apk/compactQa/app-compactQa.apk qa-output/TelegramArchive_0.42.apk
          apk=qa-output/TelegramArchive_0.42.apk
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > qa-output/apk-badging.txt
          grep -q "package: name='org.openarchive.telegram.qa.preview42'" qa-output/apk-badging.txt
          grep -q "versionName='0.42'" qa-output/apk-badging.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" qa-output/apk-badging.txt; then
             echo 'Unexpected INTERNET permission';exit 1
          fi
          sha256sum "$apk" > qa-output/SHA256SUMS.txt
          wc -c "$apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelegramArchive-0.42-single-APK
          if-no-files-found: warn
          path: |
            qa-output/
            app/build/test-results/testCompactQaUnitTest/
