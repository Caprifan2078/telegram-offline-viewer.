name: Telegram Archive 0.47 - offline synonym FTS QA
on:
  push:
    branches: [qa/v047-offline-synonym-search-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore and validate audited source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo 'd3a1bad3706dbd0b3f807671f3c63feee1f66a521f48477720c4cfc0f6650da0  .qa/v047-release-source.tar.xz' | sha256sum -c -
          rm -rf app
          tar -xJf .qa/v047-release-source.tar.xz
          grep -q 'versionCode 47' app/build.gradle
          grep -q "versionName '0.47'" app/build.gradle
          test -s app/src/main/java/org/openarchive/telegram/OfflineSynonymSearch.java
          test -s app/src/test/java/org/openarchive/telegram/OfflineSynonymSearchTest.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Synthetic FTS4 200001-message integrity test
        run: python3 qa/host_tests/fts4_sqlite_stress.py
      - name: Build a single optimized APK and run JVM tests
        run: gradle assembleCompactQa testCompactQaUnitTest --no-daemon --stacktrace
      - name: Verify QA package, offline manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          cp app/build/outputs/apk/compactQa/app-compactQa.apk qa-output/TelegramArchive_0.47.apk
          apk=qa-output/TelegramArchive_0.47.apk
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > qa-output/apk-badging.txt
          grep -q "package: name='org.openarchive.telegram.qa.preview47'" qa-output/apk-badging.txt
          grep -q "versionName='0.47'" qa-output/apk-badging.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" qa-output/apk-badging.txt; then
            echo 'Unexpected INTERNET permission';exit 1
          fi
          sha256sum "$apk" > qa-output/SHA256SUMS.txt
          wc -c "$apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelegramArchive-0.47-single-APK
          if-no-files-found: warn
          path: |
            qa-output/
            app/build/test-results/testCompactQaUnitTest/
