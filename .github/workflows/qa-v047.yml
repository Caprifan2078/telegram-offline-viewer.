name: Archive 0.47 reliability gate
on:
  push:
    branches: [qa/v047-reliability-ux-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build from real source tree and run JVM suite
        run: gradle testCompactQaUnitTest assembleCompactQa assembleCompactQaAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle connectedCompactQaAndroidTest --no-daemon --stacktrace
      - name: Validate deliverable
        if: always()
        run: |
          mkdir -p qa-output
          apk=app/build/outputs/apk/compactQa/app-compactQa.apk
          test -f "$apk"
          cp "$apk" qa-output/TelegramArchive_0.47.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > qa-output/apk-badging.txt
          ! grep -q android.permission.INTERNET qa-output/apk-badging.txt
          sha256sum qa-output/*.apk > qa-output/SHA256SUMS.txt
          adb pull /sdcard/Android/data/org.openarchive.telegram.qa.preview47/files/qa-screens qa-output/screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QA-047-api-${{ matrix.api }}
          path: |
            qa-output/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/outputs/androidTest-results/
