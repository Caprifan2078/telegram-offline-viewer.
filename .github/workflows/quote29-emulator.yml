name: Quote notes migration emulator QA
on:
  push:
    branches: [qa/v029-quote-tutorial-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-db-api26:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source
        run: |
          set -euo pipefail
          cat .qa/quote29_source.part{1,2,3,4}.b64 | base64 -d > /tmp/source.tar.xz
          echo '07999a8fec28402c0d420e4b8632a512e6b647af80ce31d22d1907629e6f7963  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: AVD test of old SavedStore database migration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          ram-size: 1536M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.QuoteSavedStoreIntegrationTest --no-daemon
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote29-api26-db-test
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
