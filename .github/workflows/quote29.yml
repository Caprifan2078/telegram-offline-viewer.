name: Quote tutorial QA APK
on:
  push:
    branches: [qa/v029-quote-tutorial-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and restore quote source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/quote29_source.part{1,2,3,4}.b64 | base64 -d > /tmp/source.tar.xz
          echo '07999a8fec28402c0d420e4b8632a512e6b647af80ce31d22d1907629e6f7963  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
          sed -i 's#Избранное / заметки#Личные заметки#g' app/src/main/java/org/openarchive/telegram/HelpContent.java
          grep -q 'Личные заметки' app/src/main/java/org/openarchive/telegram/HelpContent.java
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and both test suites
        run: gradle assembleDebug testDebugUnitTest assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Preserve APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-archive-v029-quote-qa
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
