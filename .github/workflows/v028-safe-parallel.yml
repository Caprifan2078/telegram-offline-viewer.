name: v028 parallel-install test APK
on:
  push:
    branches: [qa/v028-user-feedback-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified v028 sources
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v028-source.part{1,2,3,4}.b64 | base64 -d > /tmp/v028.tar.xz
          echo 'eb148f86e37559b643f2a06e10515baed8c8952fd954b68876b10dfb18240443  /tmp/v028.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v028.tar.xz
      - name: Apply visual fixes and isolate QA identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/org/openarchive/telegram/MainActivity.java')
          s=p.read_text()
          before='headerActions=btn("⋮");';after='headerActions=btn("≡");'
          assert s.count(before)==1
          s=s.replace(before,after)
          before='ImageView image=new ImageView(this);image.setScaleType(gallery?ImageView.ScaleType.CENTER_CROP:ImageView.ScaleType.FIT_CENTER);'
          after='ImageView image=new ImageView(this);image.setScaleType(ImageView.ScaleType.FIT_CENTER);'
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          p=Path('app/build.gradle');s=p.read_text()
          before="applicationId 'org.openarchive.telegram'"
          after="applicationId 'org.openarchive.telegram.qa'"
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          p=Path('app/src/main/AndroidManifest.xml');s=p.read_text()
          before='android:label="Telegram Archive"'
          after='android:label="Telegram Archive QA"'
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          PY
      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated QA app and JVM checks
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Export parallel APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v028-parallel-install-qa-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
          if-no-files-found: warn
