name: QA v029 quote and guide Android build
on:
  push:
    branches: [qa/v029-quotes-onboarding-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v029-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-source.tar.xz
          echo '33bfeb903b97f95794c2bc7f1eb4624d809b9253165173604920fd003b163a83  /tmp/ta-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-source.tar.xz
      - name: Set up Android 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release candidate and run local JVM tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Save APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramArchive-v029-QuoteGuide-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
