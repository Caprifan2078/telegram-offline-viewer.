name: QA v029 Saved Quotes Android migration
on:
  workflow_dispatch:
  push:
    branches: [qa/v029-quotes-onboarding-20261024]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore isolated source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v029-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-source.tar.xz
          echo '33bfeb903b97f95794c2bc7f1eb4624d809b9253165173604920fd003b163a83  /tmp/ta-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-source.tar.xz
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=run_as_root"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify old-notes migration on Android 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 1536M
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.SavedQuoteMigrationTest
      - name: Preserve instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v029-saved-quote-android-evidence
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
