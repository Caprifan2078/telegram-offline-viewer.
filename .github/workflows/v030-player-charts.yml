name: v030 Player Charts QA
on:
  workflow_dispatch:
  push:
    branches: [qa/v030-video-graphs-20261025]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v030-source.part1.b64 .qa/v030-source.part2.b64 .qa/v030-source.part3.b64 .qa/v030-source.part4.b64 | base64 -d > /tmp/source.tar.xz
          echo '81a9c8b39d793c0d1509d97aacf166b93498b575cf43e0ed4fb5898991529dfc  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
      - name: Install SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android compile plus JVM tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-video-graphs-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
