name: v032 Relationships Migration Android Emulator
on:
  push:
    branches: [qa/v032-relationships-echo-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android26:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified v032 source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v032-fullsource-part{1,2,3,4}.b64 | base64 -d >/tmp/source.tar.xz
          echo '649b10dd93a9ce07ae60b10c4e23344903a086a155cec719c447cb64ea3c9991  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
      - name: Prepare SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android API 26 SQLite migration with real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.RelationshipsMigrationTest --stacktrace
      - name: Save instrumented test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-relationships-migration-api26
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
