name: QA v033 Portable Backup Integrity
on:
  push:
    branches: [qa/v033-portability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source with SHA verification
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/portable-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-source.tar.xz
          echo '6679b27f46fcda12734cb69a58627be457fe9d2e103fd447b4e3360d31f51ca8  /tmp/ta-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-source.tar.xz
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK, instrumentation APK and run JVM tests
        run: gradle assembleDebug assembleDebugAndroidTest testDebugUnitTest --no-daemon --stacktrace
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v033-portable-qa-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/portable-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-source.tar.xz
          echo '6679b27f46fcda12734cb69a58627be457fe9d2e103fd447b4e3360d31f51ca8  /tmp/ta-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-source.tar.xz
      - name: Android 8.0 portable-backup round-trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.PortableRestoreRegressionTest
      - name: Upload Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v033-portable-api26-evidence
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
