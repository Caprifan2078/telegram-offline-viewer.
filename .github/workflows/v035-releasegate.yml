name: v035 TGS Rendering and Portable Recovery
on:
  push:
    branches: [qa/v035-safe-migration-tgs-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Recover full source and validate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v035-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-v035.tar.xz
          echo 'b151d7ab9bd6ae3bc16929bfa73a59b37adc097ab755d5a019c11afcbed42838  /tmp/ta-v035.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-v035.tar.xz
          git apply --check .qa/v035-hotfix.patch
          git apply .qa/v035-hotfix.patch
          git apply --check .qa/v035-verifier-fix.patch
          git apply .qa/v035-verifier-fix.patch
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and run JVM tests
        run: gradle assembleDebug assembleDebugAndroidTest testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v035-tgs-migration-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/test-results/
          if-no-files-found: warn
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore exact source
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/v035-source.part{1,2,3,4}.b64 | base64 -d > /tmp/ta-v035.tar.xz
          echo 'b151d7ab9bd6ae3bc16929bfa73a59b37adc097ab755d5a019c11afcbed42838  /tmp/ta-v035.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ta-v035.tar.xz
          git apply --check .qa/v035-hotfix.patch
          git apply .qa/v035-hotfix.patch
          git apply --check .qa/v035-verifier-fix.patch
          git apply .qa/v035-verifier-fix.patch
      - name: Emulator Android 8 TGS rendering, portable recovery, media isolation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.PortableRestoreRegressionTest,org.openarchive.telegram.MediaTabsIsolationTest,org.openarchive.telegram.TgsRenderingIntegrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v035-api26-evidence
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
