name: v037 Sticker Import Hardening
on:
  workflow_dispatch:
  push:
    branches: [qa/v037-sticker-import-regression-20261025]
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore exact v036 base plus fixed sticker importer
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/java/org/openarchive/telegram/TelegramImporter.java /tmp/TelegramImporter.java
          cat .qa/v036-source.part{1,2,3,4}.b64 | base64 -d > /tmp/source.tar.xz
          echo 'd16c8af59c78daf34b76b7721dee7e9f72846ab4eb1bef3a8f388ff6b3d713b8  /tmp/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/source.tar.xz
          cp /tmp/TelegramImporter.java app/src/main/java/org/openarchive/telegram/TelegramImporter.java
          test -f app/src/test/java/org/openarchive/telegram/TelegramStickerDirectSrcTest.java
      - name: Prepare SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK and run all JVM unit tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Inspect APK permissions and package
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk >/tmp/apk.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/apk.txt; then exit 1; fi
          sed -n '1,6p' /tmp/apk.txt
      - name: Collect APK and XML evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ta-v037-sticker-import-qa
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
          if-no-files-found: warn
