plugins { id 'com.android.application' }

android {
    namespace 'org.openarchive.telegram'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openarchive.telegram'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.15-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'org.jsoup:jsoup:1.21.2' }
