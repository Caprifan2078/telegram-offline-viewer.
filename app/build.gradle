plugins { id 'com.android.application' }

android {
    namespace 'org.openarchive.telegram'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openarchive.telegram'
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        targetSdk 35
        versionCode 22
        versionName '0.22-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'org.jsoup:jsoup:1.21.2'; implementation 'com.github.junrar:junrar:8.1.2'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:rules:1.6.1'; androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1' }
